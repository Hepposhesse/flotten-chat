<!doctype html>
<html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITEL__</title>
<style>
:root{--bg:#f4f6fb;--panel:#fff;--line:#dbe2f0;--ink:#1a2233;--muted:#6b7690;--brand:#1a4dc4;--brand-tief:#003399;--ok:#1f7a4d;--warn:#b45309;--agent:#eef3fe;--chef:#e8f7ee}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:.6rem 1rem;display:flex;align-items:center;gap:10px}
header b{color:var(--brand-tief);letter-spacing:.02em}
header .hint{margin-left:auto;font-size:.74rem;color:var(--muted)}
.main{flex:1;display:flex;min-height:0}
.side{flex:0 0 230px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto}
.side h2{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:12px 14px 6px}
.ch{display:flex;align-items:center;gap:8px;padding:.55rem .9rem;cursor:pointer;border-left:3px solid transparent;font-size:.9rem}
.ch:hover{background:var(--bg)}
.ch.active{border-left-color:var(--brand);background:var(--bg);font-weight:600}
.ch .badge{margin-left:auto;background:var(--line);color:var(--muted);border-radius:999px;font-size:.68rem;padding:1px 7px}
.ch .badge.unread{background:var(--brand);color:#fff;font-weight:700}
.chat{flex:1;display:flex;flex-direction:column;min-width:0}
.msgs{flex:1;overflow-y:auto;padding:14px 18px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:76%;border:1px solid var(--line);border-radius:12px;padding:.5rem .75rem;font-size:.9rem;white-space:pre-wrap;word-break:break-word}
.msg.chef{align-self:flex-end;background:var(--chef);border-bottom-right-radius:4px}
.msg.agent{align-self:flex-start;background:var(--agent);border-bottom-left-radius:4px}
.msg .meta{font-size:.68rem;color:var(--muted);margin-bottom:.2rem;display:flex;gap:8px}
.msg .typ{font-weight:700}
.msg .typ.done{color:var(--ok)}.msg .typ.task{color:var(--warn)}.msg .typ.error{color:#b4231f}
.empty{margin:auto;color:var(--muted);font-size:.92rem;text-align:center}
.compose{border-top:1px solid var(--line);background:var(--panel);padding:.6rem .9rem;display:flex;gap:8px;align-items:flex-end}
.compose textarea{flex:1;font:inherit;font-size:.92rem;border:1px solid var(--line);border-radius:10px;padding:.55rem .7rem;resize:none;min-height:44px;max-height:140px}
.compose button{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:.6rem 1.1rem;font-weight:700;font-size:.9rem;cursor:pointer}
.compose button:disabled{opacity:.5}
.btwhint{font-size:.7rem;color:var(--muted);padding:0 .95rem .5rem;background:var(--panel)}
@media(max-width:700px){.side{flex-basis:64px}.ch span.nm{display:none}.msg{max-width:92%}}
</style></head>
<body>
<header><b style="color:var(--brand-tief)">⚙ Sales-Engine</b><span style="color:var(--muted)">·</span><b>💬 Flotten-Chat</b><span class="hint">Tipp: „/btw &lt;Hinweis&gt;" = Nebenbemerkung — stört das Fenster nicht, wird kurz beantwortet</span></header>
<div class="main">
  <aside class="side"><h2>Team</h2><div id="liste"></div></aside>
  <section class="chat">
    <div class="msgs" id="msgs"><div class="empty">Wähle links ein Team-Mitglied.</div></div>
    <div class="compose"><textarea id="inp" placeholder="Nachricht … (Enter = senden, Shift+Enter = Zeile)"></textarea><button id="go" disabled>Senden</button></div>
    <div class="btwhint">Nachrichten gehen an den Eingangs-Kanal des Fensters; Antworten des Agenten erscheinen hier im selben Thread.</div>
  </section>
</div>
<script>
'use strict';
const TOKEN='__TOKEN__';
const $=s=>document.querySelector(s), el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=(p,opt={})=>fetch(p,{...opt,headers:{'Authorization':'Bearer '+TOKEN,'content-type':'application/json',...(opt.headers||{})}}).then(r=>r.json()).catch(()=>null);
let MITGLIEDER=[],cur=null,lastId=0,timer=null;
const marker=n=>Number(localStorage.getItem('fck-marker-'+n)||0);
const setMarker=(n,v)=>localStorage.setItem('fck-marker-'+n,String(v));

async function ladeMitglieder(){
  const d=await api('/api/mitglieder'); MITGLIEDER=(d&&d.mitglieder)||[];
  renderListe(); pollUnread(); setInterval(pollUnread,10000);
}
async function pollUnread(){
  const markers={}; MITGLIEDER.forEach(m=>markers[m.name]=marker(m.name));
  const d=await api('/api/unread',{method:'POST',body:JSON.stringify({markers})});
  if(!d||!d.counts)return;
  MITGLIEDER.forEach(m=>{const c=d.counts[m.name]||{n:0};const b=document.querySelector('.ch[data-n="'+m.name+'"] .badge');
    if(b){b.textContent=c.n>99?'99+':c.n;b.classList.toggle('unread',c.n>0&&m.name!==cur);}});
}
function renderListe(){
  const box=$('#liste');box.innerHTML='';
  MITGLIEDER.forEach(m=>{
    const d=el('div','ch'+(m.name===cur?' active':''),'<span class="nm">'+esc(m.anzeige||m.name)+'</span><span class="badge">0</span>');
    d.dataset.n=m.name; d.onclick=()=>waehle(m.name); box.appendChild(d);
  });
}
async function waehle(name){
  cur=name;lastId=0;$('#msgs').innerHTML='';$('#go').disabled=false;renderListe();
  await ladeNeue(true);
  if(timer)clearInterval(timer);timer=setInterval(()=>ladeNeue(false),3000);
}
async function ladeNeue(scroll){
  if(!cur)return;
  const d=await api('/api/nachrichten?name='+encodeURIComponent(cur)+'&seit='+lastId+'&limit=300');
  const rows=(d&&d.nachrichten)||[];
  if(!rows.length&&lastId===0){$('#msgs').innerHTML='<div class="empty">Noch keine Nachrichten — sag Hallo.</div>';return;}
  if(rows.length&&lastId===0)$('#msgs').innerHTML='';
  const box=$('#msgs');
  rows.forEach(r=>{
    lastId=Math.max(lastId,r.id);
    const wer=r.richtung==='agent'?(r.von||'Agent'):(r.von||'Chef');
    box.appendChild(el('div','msg '+r.richtung,
      '<div class="meta"><span>'+esc(wer)+'</span><span class="typ '+esc(r.typ)+'">'+esc(r.typ)+'</span><span>'+esc((r.erstellt_am||'').slice(0,16).replace('T',' '))+'</span>'+(r.bezug_id?'<span>↩ #'+r.bezug_id+'</span>':'')+'</div>'+esc(r.inhalt)));
  });
  if(rows.length){setMarker(cur,lastId);pollUnread();if(scroll||box.scrollHeight-box.scrollTop-box.clientHeight<120)box.scrollTop=box.scrollHeight;}
}
async function senden(){
  const t=$('#inp').value.trim();if(!t||!cur)return;
  $('#go').disabled=true;
  const d=await api('/api/nachrichten',{method:'POST',body:JSON.stringify({name:cur,richtung:'an-agent',von:'chef',typ:'fyi',inhalt:t})});
  $('#go').disabled=false;
  if(d&&d.ok){$('#inp').value='';ladeNeue(true);}else alert('Senden fehlgeschlagen — läuft der Bus?');
}
$('#go').onclick=senden;
$('#inp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();senden();}});
ladeMitglieder();
</script>
</body></html>
