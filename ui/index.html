<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flotten Chat</title>
<style>
/* Dark Mode FIRST (Simon 98760): die Blau/Dunkelblau-Rampe der Fleet ist der Standard. Light ist second (Toggle). */
:root{--blau:hsl(222 83% 58%);--blau-50:hsl(222 55% 19%);--n0:hsl(222 30% 10%);--n50:hsl(222 28% 12%);--n100:hsl(222 22% 20%);--n200:hsl(222 18% 28%);--n500:hsl(222 14% 72%);--n900:hsl(222 40% 93%);--card:hsl(222 28% 13%);color-scheme:dark}
html[data-theme="light"]{--blau:hsl(222 83% 53%);--blau-50:hsl(222 90% 97%);--n0:#fff;--n50:hsl(222 30% 97%);--n100:hsl(222 25% 92%);--n200:hsl(222 18% 84%);--n500:hsl(222 12% 45%);--n900:hsl(222 40% 13%);--card:#fff;color-scheme:light}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--n50);color:var(--n900);height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--n100)}
header b{font-size:1.02rem}
.lay{flex:1;display:flex;min-height:0}
aside{width:220px;border-right:1px solid var(--n100);background:var(--card);padding:10px;overflow:auto}
.kanal{display:block;width:100%;text-align:left;border:0;background:none;font:inherit;padding:.5rem .6rem;border-radius:9px;cursor:pointer;color:var(--n500)}
.kanal.an{background:var(--blau-50);color:var(--blau);font-weight:700}
main{flex:1;display:flex;flex-direction:column;min-width:0}
#msgs{flex:1;overflow:auto;padding:14px 18px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:70ch;background:var(--card);border:1px solid var(--n100);border-radius:12px;padding:.55rem .8rem;position:relative}
.msg .kopf{font-size:.76rem;color:var(--n500);margin-bottom:2px;display:flex;gap:.5rem;align-items:baseline}
.msg .kopf b{color:var(--n900)}
.msg .txt{white-space:pre-wrap;word-break:break-word;font-size:.95rem}
.msg.system{background:var(--blau-50);border-color:var(--blau)}
.msg .erin{position:absolute;top:6px;right:8px;border:0;background:none;cursor:pointer;opacity:.35;font-size:.9rem}
.msg .erin:hover{opacity:1}
.composer{display:flex;gap:8px;padding:12px 18px;background:var(--card);border-top:1px solid var(--n100)}
.composer textarea{flex:1;border:1px solid var(--n200);border-radius:10px;padding:.55rem .7rem;font:inherit;resize:none;min-height:44px;background:var(--n50);color:var(--n900)}
.composer button{border:0;border-radius:10px;background:var(--blau);color:#fff;font-weight:700;padding:0 18px;cursor:pointer}
.composer .clip{background:var(--card);border:1px solid var(--n200);color:var(--n500);font-size:1.05rem;padding:0 12px}
.composer .clip.rec{background:#ef4444;border-color:#ef4444;color:#fff;animation:fcrecpulse 1s infinite}
@keyframes fcrecpulse{50%{opacity:.55}}
.msg .med img{max-width:320px;max-height:240px;border-radius:10px;display:block;margin-top:6px}
.msg .med audio{margin-top:6px;width:280px}
.msg .med a{color:var(--blau);font-size:.86rem}
.agenten{margin-top:18px;border-top:1px solid var(--n100);padding-top:10px}
.agenten h4{margin:.2rem 0 .5rem;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--n500)}
.agent{display:flex;align-items:center;gap:.5rem;font-size:.85rem;padding:.25rem .3rem;color:var(--n900)}
.agent .dot{width:9px;height:9px;border-radius:50%;background:var(--n200);flex:none}
.agent .dot.on{background:hsl(145 65% 42%)}
.agent .dot.busy{animation:fcstatuspulse 1.1s infinite} /* blinkt, solange der Agent arbeitet (v0.2.0) */
@keyframes fcstatuspulse{50%{opacity:.4}}
.agent .seit{margin-left:auto;color:var(--n500);font-size:.72rem}
.agent .ag-stop{background:none;border:0;color:#ef4444;cursor:pointer;opacity:.45;font-size:.8rem;padding:0 2px;line-height:1}
.agent:hover .ag-stop{opacity:1}
body.drag main{outline:3px dashed var(--blau);outline-offset:-8px}
dialog{border:1px solid var(--n200);border-radius:14px;padding:18px;max-width:340px;background:var(--card);color:var(--n900)}
dialog input{width:100%;border:1px solid var(--n200);border-radius:9px;padding:.5rem .6rem;font:inherit;margin:.35rem 0;background:var(--n50);color:var(--n900)}
.muted{color:var(--n500);font-size:.82rem}
</style>
</head>
<body>
<header><b>⚡ Flotten Chat</b><span class="muted" id="stand"></span><button id="theme" title="Hell/Dunkel" style="border:1px solid var(--n200);background:var(--card);color:var(--n900);border-radius:9px;padding:.3rem .6rem;cursor:pointer">☀️</button><button id="remBtn" title="Erinnerungen" style="border:1px solid var(--n200);background:var(--card);color:var(--n900);border-radius:9px;padding:.3rem .6rem;cursor:pointer">⏰</button><button id="einladen" style="margin-left:auto;border:1px solid var(--n200);background:var(--card);color:var(--n900);border-radius:9px;padding:.35rem .7rem;cursor:pointer">🤖 Agent einladen</button></header>
<div class="lay">
  <aside><div id="kanaele"></div><div class="agenten"><h4>Agenten</h4><div id="agenten-liste" class="muted">–</div></div></aside>
  <main>
    <div id="msgs"></div>
    <div class="composer"><button class="clip" id="clip" title="Datei anhängen">📎</button><button class="clip" id="screen" title="Bildschirm/Fenster aufnehmen (mit Ton)">🖥️</button><input id="datei" type="file" multiple hidden><textarea id="inp" placeholder="Nachricht … (Enter sendet, Dateien einfach reinziehen)"></textarea><button id="senden">Senden</button></div>
  </main>
</div>
<dialog id="tokdlg"><b>Admin-Token</b><p class="muted">Steht in der Server-Konsole beim Start.</p><input id="tokinp" type="password" placeholder="adm_…"><button id="tokok" style="border:0;background:var(--blau);color:#fff;border-radius:9px;padding:.45rem .9rem;cursor:pointer">Los</button></dialog>
<dialog id="remdlg" style="max-width:460px;width:92vw">
  <div style="display:flex;align-items:center;gap:8px"><b>⏰ Erinnerungen</b><button id="remclose" style="margin-left:auto;border:0;background:none;color:var(--n500);cursor:pointer;font-size:1.1rem">✕</button></div>
  <div id="remliste" class="muted" style="margin:.6rem 0;max-height:52vh;overflow:auto">–</div>
  <div style="border-top:1px solid var(--n100);padding-top:.6rem">
    <input id="remtitel" placeholder="Woran erinnern?">
    <div style="display:flex;gap:6px"><input id="remwann" type="datetime-local" style="flex:1;margin:.35rem 0"><button id="remneu" style="border:0;background:var(--blau);color:#fff;border-radius:9px;padding:0 14px;cursor:pointer;font-weight:700">+ Anlegen</button></div>
  </div>
</dialog>
<script>
const $=(s)=>document.querySelector(s);
// Dark first: gespeicherte Wahl anwenden (Default = dark, kein Attribut noetig)
if(localStorage.getItem('fc_theme')==='light')document.documentElement.setAttribute('data-theme','light');
document.addEventListener('DOMContentLoaded',()=>{const b=$('#theme');if(!b)return;const set=()=>{b.textContent=document.documentElement.getAttribute('data-theme')==='light'?'🌙':'☀️';};set();b.onclick=()=>{const l=document.documentElement.getAttribute('data-theme')==='light';if(l){document.documentElement.removeAttribute('data-theme');localStorage.setItem('fc_theme','dark');}else{document.documentElement.setAttribute('data-theme','light');localStorage.setItem('fc_theme','light');}set();};});
let TOKEN=localStorage.getItem('fc_token')||'';let KANAL=localStorage.getItem('fc_kanal')||'allgemein';let LAST=0;
const api=(p,o={})=>fetch(p,{...o,headers:{authorization:'Bearer '+TOKEN,...(o.body?{'content-type':'application/json'}:{})}}).then(r=>r.json());
const esc=(s)=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function ladeKanaele(){
  const r=await api('/api/channels');
  if(!r.ok){$('#tokdlg').showModal();return false;}
  $('#kanaele').innerHTML=r.channels.filter(k=>!k.archiviert).map(k=>`<button class="kanal${k.name===KANAL?' an':''}" data-k="${esc(k.name)}">${esc(k.label||k.name)}</button>`).join('');
  document.querySelectorAll('.kanal').forEach(b=>b.onclick=()=>{KANAL=b.dataset.k;localStorage.setItem('fc_kanal',KANAL);LAST=0;$('#msgs').innerHTML='';ladeMsgs();ladeKanaele();});
  return true;
}
function medienHtml(m){
  let liste=[]; try{liste=typeof m.media==='string'?JSON.parse(m.media):(m.media||[]);}catch{}
  if(!Array.isArray(liste)||!liste.length)return '';
  return '<div class="med">'+liste.map(x=>{
    const url=esc(x.url||('/api/media/'+x.id)), mime=String(x.mime||'');
    if(mime.startsWith('image/'))return `<a href="${url}" target="_blank"><img src="${url}" alt="${esc(x.name||'Bild')}"></a>`;
    if(mime.startsWith('audio/'))return `<audio controls src="${url}"></audio>`;
    if(mime.startsWith('video/'))return `<video controls style="max-width:320px;border-radius:10px" src="${url}"></video>`;
    return `<a href="${url}" download="${esc(x.name||'datei')}">📄 ${esc(x.name||'Datei')}</a>`;
  }).join('')+'</div>';
}
function zeige(m){
  const d=document.createElement('div');d.className='msg'+(m.typ==='system'?' system':'');
  d.innerHTML=`<div class="kopf"><b>${esc(m.von)}</b><span>${esc(m.typ)}</span><span>${new Date(m.erstellt_am).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}</span></div><div class="txt">${esc(m.inhalt)}</div>${medienHtml(m)}<button class="erin" title="Erinnerung zu dieser Nachricht">⏰</button>`;
  d.querySelector('.erin').onclick=()=>remOeffnen(m.inhalt.slice(0,120),m.id);
  $('#msgs').append(d);$('#msgs').scrollTop=1e9;
}
async function ladeMsgs(){
  const r=await api(`/api/messages?kanal=${encodeURIComponent(KANAL)}&seit=${LAST}`);
  if(r.ok)for(const m of r.messages){zeige(m);LAST=m.id;}
}
async function senden(){
  const t=$('#inp').value.trim();if(!t)return;$('#inp').value='';
  await api('/api/send',{method:'POST',body:JSON.stringify({kanal:KANAL,inhalt:t,von:'du'})});
}
$('#senden').onclick=senden;
$('#inp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();senden();}});
// Datei-Upload: waehlen oder reinziehen → hochladen → sofort als Nachricht in den Kanal.
async function ladeHoch(dateien){
  for(const f of dateien){
    const r=await fetch('/api/media',{method:'POST',headers:{authorization:'Bearer '+TOKEN,'x-fc-name':encodeURIComponent(f.name),'content-type':f.type||'application/octet-stream'},body:f}).then(x=>x.json()).catch(()=>null);
    if(!r||!r.ok){alert('Upload fehlgeschlagen: '+f.name);continue;}
    await api('/api/send',{method:'POST',body:JSON.stringify({kanal:KANAL,von:'du',inhalt:'📎 '+f.name,media:[{id:r.id,url:r.url,name:f.name,mime:f.type||'application/octet-stream'}]})});
  }
  ladeMsgs();
}
// Bildschirm-/Fensteraufnahme (mit Ton) → direkt als Video-Nachricht. Browser-nativ via getDisplayMedia;
// im echten Chrome/Chromium sofort, im Electron-Cockpit über den setDisplayMediaRequestHandler des Hosts.
let scRec=null,scChunks=[],scDisp=null,scMic=null,scAudioCtx=null;
function screenCleanup(){
  [scDisp,scMic].forEach(s=>{if(s)s.getTracks().forEach(t=>t.stop());});scDisp=null;scMic=null;
  if(scAudioCtx){try{scAudioCtx.close();}catch(e){}scAudioCtx=null;}
  const b=$('#screen');b.textContent='🖥️';b.classList.remove('rec');b.title='Bildschirm/Fenster aufnehmen (mit Ton)';
}
async function screenStart(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getDisplayMedia){alert('Bildschirmaufnahme wird hier nicht unterstützt (im echten Chrome/Chromium oder im Cockpit möglich).');return;}
  let disp;try{disp=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true});}catch(e){return;} // Abbruch im Picker
  scDisp=disp;scChunks=[];
  let mic=null;try{mic=await navigator.mediaDevices.getUserMedia({audio:true});}catch(e){mic=null;}scMic=mic;
  const vid=disp.getVideoTracks()[0],tracks=[vid],sys=disp.getAudioTracks();
  if(sys.length||mic){ // System-Ton + Mikro zu einer Spur mischen (Voice-over)
    try{scAudioCtx=new (window.AudioContext||window.webkitAudioContext)();const dest=scAudioCtx.createMediaStreamDestination();
      if(sys.length)scAudioCtx.createMediaStreamSource(new MediaStream([sys[0]])).connect(dest);
      if(mic)scAudioCtx.createMediaStreamSource(mic).connect(dest);tracks.push(dest.stream.getAudioTracks()[0]);
    }catch(e){if(sys.length)tracks.push(sys[0]);else if(mic)tracks.push(mic.getAudioTracks()[0]);}
  }
  const mixed=new MediaStream(tracks);
  try{scRec=new MediaRecorder(mixed,{mimeType:'video/webm'});}catch(e){try{scRec=new MediaRecorder(mixed);}catch(e2){alert('Aufnahme nicht möglich');screenCleanup();return;}}
  scRec.ondataavailable=e=>{if(e.data&&e.data.size)scChunks.push(e.data);};
  scRec.onstop=async()=>{const blob=new Blob(scChunks,{type:'video/webm'});const alt=scRec;scRec=null;screenCleanup();
    if(!blob.size)return;
    const name='Bildschirmaufnahme.webm';
    const r=await fetch('/api/media',{method:'POST',headers:{authorization:'Bearer '+TOKEN,'x-fc-name':encodeURIComponent(name),'content-type':'video/webm'},body:blob}).then(x=>x.json()).catch(()=>null);
    if(!r||!r.ok){alert('Upload der Aufnahme fehlgeschlagen');return;}
    await api('/api/send',{method:'POST',body:JSON.stringify({kanal:KANAL,von:'du',inhalt:'🖥️ Bildschirmaufnahme',media:[{id:r.id,url:r.url,name:name,mime:'video/webm'}]})});
    ladeMsgs();
  };
  vid.addEventListener('ended',()=>{if(scRec&&scRec.state!=='inactive')scRec.stop();}); // nativer „Freigabe beenden"
  scRec.start(1000);
  const b=$('#screen');b.textContent='⏹';b.classList.add('rec');b.title='Aufnahme stoppen & senden';
}
$('#screen').onclick=()=>{if(scRec&&scRec.state!=='inactive')scRec.stop();else screenStart();};
$('#clip').onclick=()=>$('#datei').click();
$('#datei').onchange=()=>{ladeHoch([...$('#datei').files]);$('#datei').value='';};
document.addEventListener('dragover',e=>{e.preventDefault();document.body.classList.add('drag');});
document.addEventListener('dragleave',e=>{if(!e.relatedTarget)document.body.classList.remove('drag');});
document.addEventListener('drop',e=>{e.preventDefault();document.body.classList.remove('drag');if(e.dataTransfer?.files?.length)ladeHoch([...e.dataTransfer.files]);});
// Presence: verbundene Agenten mit Lampe (gruen = in den letzten 90s gesehen).
async function ladeAgenten(){
  const r=await api('/api/presence');if(!r.ok)return;
  const jetzt=Date.now();
  $('#agenten-liste').innerHTML=(r.agents||[]).map(a=>{
    const t=a.zuletzt_gesehen?new Date(a.zuletzt_gesehen).getTime():0;
    const on=jetzt-t<90000;
    const busy=on&&a.status==='busy'; // Punkt blinkt genau dann (v0.2.0)
    const seit=t?(on?'jetzt':Math.max(1,Math.round((jetzt-t)/60000))+'m'):'nie';
    return `<div class="agent" data-name="${esc(a.name)}"><span class="dot${on?' on':''}${busy?' busy':''}"></span>${esc(a.name)}<span class="seit">${seit}</span>${on?'<button class="ag-stop" title="Stopp anfordern">⛔</button>':''}</div>`;
  }).join('')||'<span class="muted">Noch keine Agenten verbunden.</span>';
  $('#agenten-liste').querySelectorAll('.ag-stop').forEach(b=>{b.onclick=async()=>{
    const name=b.closest('.agent').dataset.name;
    const rr=await api('/api/stop',{method:'POST',body:JSON.stringify({name})});
    if(rr&&rr.ok){b.textContent='✓';setTimeout(()=>{b.textContent='⛔';},1600);}
  };});
}
setInterval(ladeAgenten,10000);
// ── Erinnerungen: Übersicht (überfällig/heute offen · Zukunft eingeklappt · verschieben/abhaken) ──
let remZukunftAuf=false, remQuelle=null;
function remZeit(iso){try{return new Date(iso).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}catch{return iso;}}
function remGruppen(liste){
  const jetzt=Date.now(),heute=new Date().toDateString(),ueber=[],heu=[],spaet=[];
  (liste||[]).filter(r=>(r.status||'offen')==='offen'&&r.faellig_am)
    .sort((a,b)=>Date.parse(a.faellig_am)-Date.parse(b.faellig_am))
    .forEach(r=>{const t=Date.parse(r.faellig_am);if(t<=jetzt)ueber.push(r);else if(new Date(t).toDateString()===heute)heu.push(r);else spaet.push(r);});
  return {ueber,heu,spaet};
}
function remZeile(r,rot){
  return `<div class="remrow" data-id="${r.id}" style="display:flex;gap:8px;align-items:center;padding:.4rem .2rem;border-bottom:1px solid var(--n100)"><span style="color:${rot?'#e5484d':'var(--n500)'};font-size:.76rem;white-space:nowrap">${esc(remZeit(r.faellig_am))}</span><span style="flex:1;font-size:.9rem;word-break:break-word">${esc(r.titel)}</span><button class="rem-ver" title="Verschieben" style="border:0;background:none;cursor:pointer">🕐</button><button class="rem-erl" title="Erledigt" style="border:0;background:none;cursor:pointer">✅</button></div>`;
}
async function remLaden(){
  const r=await api('/api/reminders?status=offen');if(!r.ok)return;
  const g=remGruppen(r.reminders);let h='';
  const kopf=(t,c)=>`<div style="font-size:.72rem;font-weight:700;color:${c};margin:.5rem 0 .1rem">${t}</div>`;
  if(g.ueber.length)h+=kopf('Überfällig','#e5484d')+g.ueber.map(x=>remZeile(x,true)).join('');
  if(g.heu.length)h+=kopf('Heute','var(--n500)')+g.heu.map(x=>remZeile(x,false)).join('');
  if(g.spaet.length){h+=`<button id="remtoggle" style="border:0;background:none;color:var(--blau);cursor:pointer;font-size:.8rem;margin:.55rem 0 .1rem">${remZukunftAuf?'▾':'▸'} Später (${g.spaet.length})</button>`;if(remZukunftAuf)h+=g.spaet.map(x=>remZeile(x,false)).join('');}
  $('#remliste').innerHTML=h||'<span class="muted">Keine offenen Erinnerungen.</span>';
  const tg=$('#remtoggle');if(tg)tg.onclick=()=>{remZukunftAuf=!remZukunftAuf;remLaden();};
  $('#remliste').querySelectorAll('.remrow').forEach(row=>{const id=row.dataset.id;
    row.querySelector('.rem-erl').onclick=async()=>{await api('/api/reminders/'+id+'/erledigt',{method:'POST'});remLaden();};
    row.querySelector('.rem-ver').onclick=()=>{const inp=document.createElement('input');inp.type='datetime-local';inp.style.marginLeft='6px';inp.onchange=async()=>{if(!inp.value)return;await api('/api/reminders/'+id+'/verschieben',{method:'POST',body:JSON.stringify({faellig_am:new Date(inp.value).toISOString()})});remLaden();};row.appendChild(inp);inp.showPicker?.();inp.focus();};
  });
}
function remOeffnen(prefill,quelle){remQuelle=quelle||null;$('#remtitel').value=prefill||'';$('#remwann').value='';$('#remdlg').showModal();remLaden();(prefill?$('#remwann'):$('#remtitel')).focus();}
$('#remBtn').onclick=()=>remOeffnen('',null);
$('#remclose').onclick=()=>$('#remdlg').close();
$('#remneu').onclick=async()=>{const t=$('#remtitel').value.trim(),w=$('#remwann').value;if(!t||!w){(t?$('#remwann'):$('#remtitel')).focus();return;}const r=await api('/api/reminders',{method:'POST',body:JSON.stringify({kanal:KANAL,titel:t.slice(0,120),quelle_msg:remQuelle,faellig_am:new Date(w).toISOString()})});if(r&&r.ok){$('#remtitel').value='';$('#remwann').value='';remQuelle=null;remLaden();}};
$('#tokok').onclick=async()=>{TOKEN=$('#tokinp').value.trim();localStorage.setItem('fc_token',TOKEN);$('#tokdlg').close();start();};
$('#einladen').onclick=async()=>{
  const r=await api('/api/invites',{method:'POST',body:JSON.stringify({kanal:KANAL,basis:location.origin})});
  if(r.ok)prompt('Diesen Satz deinem Agenten geben:',`Verbinde dich mit meinem Flotten Chat: fc connect ${location.origin} ${r.invite_token}`);
};
function sse(){
  const es=new EventSource('/api/events?token='+TOKEN);// SSE kann keine Header — Kern prüft Bearer, UI nutzt Poll-Fallback
  es.addEventListener('message',(e)=>{const m=JSON.parse(e.data);if(m.kanal===KANAL&&m.id>LAST){zeige(m);LAST=m.id;}});
  es.onerror=()=>es.close();
}
async function start(){ if(await ladeKanaele()){ladeMsgs();ladeAgenten();sse();setInterval(ladeMsgs,4000);$('#stand').textContent='verbunden';} }
start();
</script>
</body>
</html>
